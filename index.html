<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Skills test</title>
      <style>
        body {
            background-image: url(https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/308f6785-a4ae-4970-a7ef-8a3236344bff/JAR_2646a.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction:column;
            margin: 0;
        }
         .content-wrapper {
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .contact-card {
            background-color: rgba(255, 255, 255, 0.8); 
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 1000px; 
            padding: 45px 40px; 
            min-height: 550px; 
        }
    </style>
</head>
<body>
      <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10" width="50" height="50" a class="navbar-brand" href="#">Logo</a>
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavbar"> 
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#">Homepage</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contact Us</a>
                </li>
            </ul>
    </div>
    </nav>
    <h1 style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif; color: white;">OBMC Enrollment</h1>
    <div class="content-wrapper">
        <div class="contact-card">
            <h2>Student's information</h2>
            <form>
                <div class="row mb-3">
                 <div class="col-md-6">
                     <label for="firstName" class="form-label small">First name</label>
                 <input type="text" class="form-control" id="firstName" placeholder="Enter your first name">
                </div>
                <div class="col-md-6">
                    <label for="lastName" class="form-label small">Last name</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Enter your last name">
                </div>
                <div class="row mb-3">
                <div class="col-md-4">
                    <label for="birthDate" class="form-label small">Birth Date</label>
                    <input type="date" class="form-control form-control-sm" id="birthDate">
                </div>
                <div class="col-md-4">
                    <label for="gender" class="form-label small">Gender</label>
                    <select class="form-select form-select-sm" id="gender">
            <option selected disabled value="">Pick...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
                </div>
                <div class="col-md-4">
                    <label for="gradeLevel" class="form-label small">Grade Level</label>
                    <select class="form-select form-select-sm" id="gradeLevel">
            <option selected disabled value="">Pick...</option>
            <option value="1">Junior Casa</option>
            <option value="2">Junior Advance Casa</option>
            <option value="3">Advance Casa</option>
            <option value="4">Grade 1</option>
            <option value="5">Grade 2</option>
            <option value="6">Grade 3</option>
            <option value="7">Grade 4</option>
            <option value="8">Grade 5</option>
            <option value="9">Grade 6</option>
            <option value="10">Grade 7</option>
            <option value="11">Grade 8</option>
            <option value="12">Grade 9</option>
            <option value="13">Grade 10</option>
            <option value="14">Grade 11</option>
            <option value="15">Grade 12</option>
                        </select>
                    </div>
                </div>
                <h2 class="mt-4 mb-3 pt-3 border-top">Contact Details</h2>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="emailAddress" class="form-label small">Email Address</label>
                        <input type="email" class="form-control form-control-sm" id="emailAddress" placeholder="Enter email address">
                    </div>
                    <div class="col-md-6">
                        <label for="contactNumber" class="form-label small">Contact Number</label>
                        <input type="tel" class="form-control form-control-sm" id="contactNumber" placeholder="Enter phone number">
                    </div>
                </div>
                <div class="row g-2 mt-4">
    <div class="col-6">
        <button type="reset" class="btn btn-danger w-100">Reset</button>
    </div>
    <div class="col-6">
        <button type="submit" class="btn btn-primary w-100">Submit</button>
    </div>
</div>
        </form>
</body>
</html>
